# nginx для 3D-Store.
# Кладётся в /etc/nginx/conf.d/3d-store.conf
#
# Если у вас есть домен — замените server_name на него, затем получите
# бесплатный сертификат: certbot --nginx -d ваш-домен.ru
# (certbot сам допишет сюда HTTPS-секцию).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Важно: загрузка фото моделей — до 8 МБ.
    # Без этой строки nginx отклоняет файлы больше 1 МБ.
    client_max_body_size 12M;

    # Логи
    access_log /var/log/nginx/3d-store.access.log;
    error_log  /var/log/nginx/3d-store.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }
}
