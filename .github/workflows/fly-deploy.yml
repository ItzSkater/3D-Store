# Авто-деплой на Fly.io при пуше в main (и по кнопке "Run workflow").
# Разово нужно: 1) создать приложение и том на ПK (fly launch + fly volumes create),
# 2) добавить в GitHub Secrets токен FLY_API_TOKEN (получить: fly tokens create deploy).
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
