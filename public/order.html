<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#08090a" />
  <meta name="description" content="Статусы ваших заказов и переписка с продавцом." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Мои заказы — 3D-Store" />
  <meta property="og:description" content="Статусы ваших заказов и переписка с продавцом." />
  <title>Мои заказы — 3D-Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;510;600&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site">
    <div class="container">
      <a class="brand" href="/"><span class="logo">🧊</span><span>3D-Store</span></a>
      <nav class="nav-links" id="navLinks">
        <a class="btn ghost small" href="/">Каталог</a>
        <span id="authArea"></span>
        <button class="btn theme-toggle" id="themeToggle" type="button" title="Тема">🌗</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="hero" style="padding-bottom:6px;">
      <h1>Мои заказы</h1>
      <p>Здесь ваши заказы и чат с продавцом по каждому из них.</p>
    </div>

    <div id="content">
      <div class="empty">Загрузка…</div>
    </div>
  </main>

  <!-- Модалка входа / регистрации -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal" style="max-width: 420px;">
      <header>
        <h2 id="authTitle">Вход в аккаунт</h2>
        <button class="x" data-auth-close>&times;</button>
      </header>
      <div class="content">
        <div class="tabs">
          <div class="tab active" data-auth-tab="login">Вход</div>
          <div class="tab" data-auth-tab="register">Регистрация</div>
        </div>
        <label>Юзернейм</label>
        <input type="text" id="authUsername" placeholder="например, alex_3d" autocomplete="username" />
        <div id="regExtra" style="display:none;">
          <label>Отображаемое имя (необязательно)</label>
          <input type="text" id="authDisplay" placeholder="Как показывать вас продавцу" />
          <label>Телефон (необязательно)</label>
          <input type="text" id="authPhone" placeholder="+7 ..." />
        </div>
        <label>Пароль</label>
        <input type="password" id="authPassword" placeholder="Минимум 4 символа" autocomplete="current-password" />
        <div class="hint">Email не требуется.</div>
        <div class="msg-error" id="authError"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" data-auth-close>Отмена</button>
        <button class="btn primary" id="authSubmit">Войти</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/order.js"></script>
</body>
</html>
